name: Compile Workshop
on:
  push:
    branches: [main]
    paths: ["pc/workshop/**", ".github/workflows/workshop.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build pc/workshop/Workshop/Workshop.csproj -c Release
