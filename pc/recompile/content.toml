# A background layer's full refill (func_8004FA64: a level's start, a teleport
# or area change) requests the view's width in 16-pixel tile columns from the
# view's left column, without the extra column the row request adds when the
# view isn't on a tile boundary. Expand's view starts 56 px left of the 4:3
# one (half a tile off), so the refill stopped 8 px short of the right edge,
# which showed whatever was left there (after a teleport, the page turn).
